services:
  frontend:
    build: ./BookStore_GiaoDien
    ports:
      - "80:80"
    depends_on:
      - bookstore-app
    restart: always

  bookstore-app:
    build: .
    expose:
      - "10000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=BookStoreDb;User Id=sa;Password=BookStore@Str0ng!;TrustServerCertificate=True
      # --- App ---
      - AppSettings__BaseUrl=http://13.228.219.111
      - AppSettings__ClientUrl=http://13.228.219.111
      - AppSettings__UseSecureCookie=false
      # --- JWT: Issuer = API server, Audience = frontend ---
      - JWT__ValidIssuer=http://13.228.219.111
      - JWT__ValidAudience=http://13.228.219.111
      # --- CORS: cho phép cả EC2 lẫn Vercel (nếu cần) ---
      - Cors__AllowedOrigins__0=http://13.228.219.111
      - Cors__AllowedOrigins__1=https://book-lumen.vercel.app
    restart: always

  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=BookStore@Str0ng!
    volumes:
      - db_data:/var/opt/mssql
    restart: always
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "BookStore@Str0ng!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db_data:
